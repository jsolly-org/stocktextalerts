name: Auto Merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # ARM: cheapest tier; this job is a single bare `gh` call — arch-irrelevant.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # Gate at the job level so Dependabot / fork / draft events skip with ZERO
    # billed runner minutes. Same-repo maintainer + agent PRs arm immediately;
    # Dependabot stays off (janitor arms via `gh` after prep).
    # Fork PRs never auto-merge.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Enable auto-merge for same-repo non-Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge --auto --squash --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
