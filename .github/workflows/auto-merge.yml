name: Auto Merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # ARM: cheapest tier; this job is a single bare `gh` call — arch-irrelevant.
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # Gate at the job level so Dependabot / fork / draft events skip with ZERO
    # billed runner minutes. Same-repo maintainer + agent PRs arm immediately;
    # Dependabot stays off (janitor arms via `gh` after prep).
    # Fork PRs never auto-merge.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Enable auto-merge for same-repo non-Dependabot PRs
        env:
          # Prefer a PAT so the eventual squash merge is attributed to that
          # identity and creates a normal `push` to main (CI → Deploy).
          # `GITHUB_TOKEN` merges are performed as github-actions[bot] and
          # GitHub suppresses *all* workflow runs from that token's events —
          # including `pull_request` closed — so post-merge-bot never sees
          # them (observed on #647, the first Actions-bot auto-merge).
          GH_TOKEN: ${{ secrets.JANITOR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_JANITOR_PAT: ${{ secrets.JANITOR_GITHUB_TOKEN != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$HAS_JANITOR_PAT" != "true" ]; then
            echo "::warning::JANITOR_GITHUB_TOKEN unset — auto-merge will use GITHUB_TOKEN; main push workflows will be suppressed and Deploy will not follow. Set the janitor PAT (Contents + PRs + Actions write)."
          fi
          gh pr merge --auto --squash --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
