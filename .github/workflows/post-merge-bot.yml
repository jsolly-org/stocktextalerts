name: Post-merge bot dispatch

# Belt-and-suspenders for GITHUB_TOKEN merges.
#
# Preferred path: auto-merge.yml arms with JANITOR_GITHUB_TOKEN so the squash
# merge creates a normal `push` → CI → Deploy chain (see docs/github-ci.md).
#
# Fallback: when a merge is still attributed to github-actions[bot] (PAT unset
# or stale arm), GitHub suppresses the `push` workflow event. This workflow
# listens for `pull_request` closed and workflow_dispatches CI on main.
# Note: GITHUB_TOKEN-authored merges may also suppress this closed trigger
# (observed on #647) — do not rely on it alone; keep the PAT on auto-merge.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: dispatch CI
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.merged_by.login == 'github-actions[bot]'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    steps:
      - name: Workflow-dispatch CI on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          echo "Bot-merged PR #${{ github.event.pull_request.number }} → $MERGE_SHA"
          echo "Dispatching CI on main (push events were suppressed); Deploy follows green CI."
          gh workflow run CI --repo "$GITHUB_REPOSITORY" --ref main
