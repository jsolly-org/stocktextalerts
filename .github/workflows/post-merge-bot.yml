name: Post-merge bot dispatch

# GITHUB_TOKEN merges (Actions auto-merge) do not create push workflow runs —
# GitHub suppresses those events to prevent recursion. Human merges still fire
# push → CI normally; Deploy then follows via workflow_run after green CI.
# For bot merges, this workflow catches pull_request closed and workflow_dispatches
# CI on main only (workflow_dispatch is a documented exception to the GITHUB_TOKEN
# recursion guard). Do not dispatch Deploy here — Deploy is gated on green CI.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: dispatch CI
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.merged_by.login == 'github-actions[bot]'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    steps:
      - name: Workflow-dispatch CI on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          echo "Bot-merged PR #${{ github.event.pull_request.number }} → $MERGE_SHA"
          echo "Dispatching CI on main (push events were suppressed); Deploy follows green CI."
          gh workflow run CI --repo "$GITHUB_REPOSITORY" --ref main
