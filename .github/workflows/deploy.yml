name: Deploy

# After green CI on main (workflow_run) — same trigger shape as the jsolly aws-sam fleet.
# Body stays STA-specific (migrations, live-provider, Blacksmith, Production env).
# post-merge-bot may workflow_dispatch CI when GITHUB_TOKEN merges suppress push; the
# job if allows that CI event so Deploy still follows. Human workflow_dispatch is
# break-glass. No Deploy `push` trigger — that would race ahead of (or parallel) main CI.
# Deploy SHA: workflow_run → CI head_sha; workflow_dispatch → github.sha.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: production
    # Only deploy on green CI that was a push to main (or bot-dispatched CI).
    # Skip failed CI and pull_request CI whose head branch is also named main.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    environment: Production
    env:
      CI: true
      AWS_REGION: ${{ vars.AWS_REGION }}
      DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run default checkout is the workflow file's default branch tip,
          # not the CI commit — pin to the SHA that just passed CI.
          ref: ${{ env.DEPLOY_SHA }}
          # Depth 2 so "Refuse infra-only deploys" can diff HEAD against its parent.
          # At the default depth 1 the parent object is absent and `git diff-tree HEAD`
          # prints NOTHING — the gate passed vacuously for every commit (caught 2026-07-03
          # when a template.yaml-touching commit sailed through).
          fetch-depth: 2

      - name: Refuse stale deploy
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          # Read main's tip via ls-remote — NOT `git fetch origin main --depth=1`.
          # When tip == deploy_sha (HEAD is main's tip), a --depth=1 fetch re-shallows the
          # checkout to depth 1, dropping HEAD's parent — which the next step's
          # `git diff-tree HEAD` needs. Concurrency is cancel-in-progress:false, so several
          # main deploys can queue; this drops any whose commit main has moved past.
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" != "$DEPLOY_SHA" ]; then
            echo "Deploy triggered for $DEPLOY_SHA but main is now at $tip; refusing stale deploy."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      # No supabase/setup-cli: the production `supabase db push` in aws/deploy-web.sh resolves the
      # lock-pinned `supabase` devDependency via node_modules/.bin on PATH (deploy-web.sh prepends it;
      # `npm ci` above installs it). One pinned CLI (2.109.0) is validated in CI AND applied to prod —
      # keeping a `version: latest` setup-cli here would be dead, shadowed config and reintroduce the
      # exact validate-on-X / apply-on-Y drift this repo pins the CLI to avoid.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Refuse infra-only deploys
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          # Fail CLOSED on an empty file list: with a too-shallow checkout diff-tree
          # prints nothing and this gate silently passes for EVERY commit (the
          # 2026-07-03 vacuous-pass). An unverifiable diff must block, not wave through.
          if [ -z "$changed" ]; then
            echo "git diff-tree returned no files (shallow checkout?) — cannot verify the landed commit; refusing deploy."
            exit 1
          fi
          # Refuse ONLY when the commit is pure infra (template/deploy.sh and nothing
          # else). A mixed commit that also lands app/handler/migration changes must
          # still run code+migration deploy — blocking those left Lambdas stale until
          # a later tip deploy (and blocked migrations entirely for that commit).
          # CloudFormation still needs a manual `npm run deploy:infra`; the infra-drift
          # check below + update-function-code failures on brand-new functions catch that.
          if grep -Eq '^aws/(template\.yaml|deploy\.sh)$' <<<"$changed"; then
            non_infra="$(grep -Ev '^aws/(template\.yaml|deploy\.sh)$' <<<"$changed" || true)"
            if [ -z "$non_infra" ]; then
              echo "Commit only changes aws/template.yaml and/or aws/deploy.sh."
              echo "Run npm run deploy:infra manually with admin credentials."
              exit 1
            fi
            echo "::warning::aws/template.yaml or aws/deploy.sh changed alongside app code."
            echo "Proceeding with migrations + Lambda code update. Still run npm run deploy:infra"
            echo "for new resources / env / IAM / schedule changes. Infra-drift check only"
            echo "enforces Timeout/MemorySize parity — it will not catch env or IAM drift."
          fi

      - name: Deploy migrations and Lambdas
        run: bash aws/deploy-web.sh --deploy-ci

      # Fails red when the deployed Lambda config (Timeout/MemorySize) drifts from
      # aws/template.yaml — i.e. a committed infra change whose manual `deploy:infra`
      # hasn't run yet. Code deploys ride this workflow; infra does not, so this is
      # the only automated signal for the "code half deployed, infra half pending"
      # gap (the 2026-07-07 asset-maintenance timeout incident).
      - name: Infra drift check
        run: npm run check:infra-drift

      - name: Live provider check
        run: |
          set -euo pipefail
          payload="{\"id\":\"github-actions-deploy\",\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
          response="$(aws lambda invoke \
            --function-name stocktextalerts-live-provider-check \
            --payload "$payload" \
            --cli-binary-format raw-in-base64-out \
            --query '{StatusCode:StatusCode,FunctionError:FunctionError}' \
            --output json \
            /tmp/live-provider-check.json)"
          echo "$response"
          function_error="$(python3 -c 'import json,sys; print((json.load(sys.stdin).get("FunctionError") or ""))' <<<"$response")"
          if [ -n "$function_error" ] && [ "$function_error" != "None" ]; then
            echo "Live provider check failed with FunctionError=$function_error"
            python3 -m json.tool /tmp/live-provider-check.json || true
            exit 1
          fi
          # Fail closed if the just-uploaded bundle's stamped RELEASE_ID does not match
          # this deploy's commit — catches a silent no-op update or wrong artifact.
          expected_release="$(printf '%s' "$DEPLOY_SHA" | cut -c1-12)"
          EXPECTED_RELEASE="$expected_release" python3 - <<'PY'
          import json, os, sys
          body = json.load(open("/tmp/live-provider-check.json"))
          if body.get("ok") is not True:
              print(
                  f"Deploy freshness mismatch: expected ok=true, got {body!r}",
                  file=sys.stderr,
              )
              sys.exit(1)
          release = body.get("releaseId") or ""
          expected = os.environ["EXPECTED_RELEASE"]
          if release != expected:
              print(
                  f"Deploy freshness mismatch: Lambda releaseId={release!r} expected {expected!r}",
                  file=sys.stderr,
              )
              print(json.dumps(body, indent=2), file=sys.stderr)
              sys.exit(1)
          print(f"✓ live-provider-check releaseId={release} matches deploy SHA")
          PY
