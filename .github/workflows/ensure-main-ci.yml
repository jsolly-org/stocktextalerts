name: Ensure main CI

# Safety net when a land still happens as github-actions[bot] (REPO_AUTOMATION_TOKEN
# unset, or merge-pr failed). Those merges do not create push workflow runs —
# GitHub's recursion guard (observed on #647). workflow_dispatch is an allowed
# exception: poll main's tip and dispatch CI when no green/in-flight run exists.
# Preferred path is CI merge-pr with REPO_AUTOMATION_TOKEN (normal push). Human
# merges and PAT merges already get push → CI; this job is then a no-op.

on:
  schedule:
    # Hourly, at :07 to stay off the :00 stampede. GitHub throttles high-frequency
    # cron on busy repos anyway — a `*/10` schedule was observed delivering ~hourly
    # (2026-08-13), so the old "10 min worst-case lag" claim was already false.
    # Worst-case lag after a bot merge before Deploy can start is therefore ~1 h;
    # this is a safety net for a path that normally does not fire at all (PAT
    # merges and human merges produce push → CI directly).
    - cron: "7 * * * *"
  workflow_dispatch:
  # Also run when any workflow completes on main? Too noisy. Schedule is enough.

permissions:
  actions: write
  contents: read
  checks: read

# One safety-net run at a time. Without this, a runner shortage lets every cron
# tick enqueue an independent no-op; on 2026-08-13 a Blacksmith us-west ARM outage
# stacked five of them ahead of Auto Merge and `merge-pr` in the 2vcpu ARM FIFO,
# and GitHub reported the queue wait as 3-5 h "runtime". Superseding is correct
# here: every run does the identical main-tip check, so the newest wins.
# This is only safe because the job runs on GitHub-hosted capacity (below) — on a
# starved self-hosted pool, cancel-in-progress would drop the waiting job's FIFO
# place and re-queue at the tail on every tick, starving the safety net entirely.
concurrency:
  group: ensure-main-ci
  cancel-in-progress: true

jobs:
  ensure:
    name: ensure CI on main tip
    # GitHub-hosted on purpose: two `gh api` calls, no checkout, no build. Running
    # it on Blacksmith buys nothing and lets a provider ARM outage jam the same
    # queue that `merge-pr` needs to land a green PR.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch CI if main tip has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          echo "main tip: ${tip}"

          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=30")"
          green="$(printf '%s' "$runs_json" | jq --arg tip "$tip" \
            '[.workflow_runs[] | select(.head_sha == $tip and .conclusion == "success")] | length')"
          inflight="$(printf '%s' "$runs_json" | jq --arg tip "$tip" \
            '[.workflow_runs[] | select(.head_sha == $tip and (.status == "queued" or .status == "in_progress"))] | length')"

          echo "green CI runs for tip: ${green}; in-flight: ${inflight}"
          if [ "$green" -gt 0 ]; then
            echo "Main tip already has green CI — nothing to do."
            exit 0
          fi
          if [ "$inflight" -gt 0 ]; then
            echo "CI already in flight for tip — nothing to do."
            exit 0
          fi

          echo "No CI for main tip — workflow_dispatching CI on main."
          gh workflow run CI --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched. Deploy follows via workflow_run after green CI."
